# Integración continua de la aplicación web (HU-61). Estilo, tipos, pruebas y
# compilación corren en paralelo, cada uno en su trabajo. El último trabajo
# junta los resultados y es el que exige la protección de ramas (HU-62): si
# cualquiera falla, se cancela o no corre, el pull request no se puede integrar.
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

# En un pull request, un push nuevo cancela la corrida anterior. En develop y
# main no: cada fusión tiene que quedar verificada.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: Estilo (ESLint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/preparar
      - run: npm run lint

  types:
    name: Tipos (TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/preparar
      - run: npm run typecheck

  test:
    name: Pruebas (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/preparar
      # El reporter de GitHub marca cada prueba que falla en el pull request.
      - run: npm test -- --reporter=default --reporter=github-actions

  # Compila con la misma orden que Vercel (tsc -b + vite build).
  build:
    name: Compilación
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/preparar
      - run: npm run build

  # Conserva el nombre del trabajo anterior porque es el que exige la
  # protección de ramas de develop y main.
  ci:
    name: Estilo, tipos, pruebas y compilación
    if: always()
    needs: [lint, types, test, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resultado de cada verificación
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "### Resultado de la integración continua" >> "$GITHUB_STEP_SUMMARY"
          echo "| Verificación | Resultado |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "$RESULTS" | jq -r 'to_entries[] | "| \(.key) | \(.value.result) |"' >> "$GITHUB_STEP_SUMMARY"
          failed=$(echo "$RESULTS" | jq -r '[to_entries[] | select(.value.result != "success") | .key] | join(", ")')
          if [ -n "$failed" ]; then
            echo "::error::No pasaron: $failed"
            exit 1
          fi
          echo "Todas las verificaciones pasaron."
