# Análisis de calidad en SonarCloud (trabajo «sonar» del CI). La clave del
# proyecto y la organización las pone el workflow desde la variable
# SONAR_ORGANIZATION del repositorio.
sonar.projectName=TesisFrontend
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx
sonar.exclusions=**/*.test.ts,**/*.test.tsx,src/routeTree.gen.ts
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8
